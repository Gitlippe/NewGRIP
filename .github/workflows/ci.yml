name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -e '.[dev]'
      - name: Lint and test
        run: |
          . .venv/bin/activate
          ruff check src tests
          pytest

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck/test/build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

  e2e-artifacts:
    runs-on: ubuntu-latest
    needs: [engine-tests, web-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        run: |
          cd services/engine
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -e '.[dev]'
      - name: Install frontend deps
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install chromium
      - name: Start services
        run: |
          cd services/engine
          . .venv/bin/activate
          nohup uvicorn newgrip_engine.app:app --host 127.0.0.1 --port 8000 >/tmp/newgrip-engine.log 2>&1 &
          cd ../../apps/web
          nohup pnpm dev --host 127.0.0.1 --port 5173 >/tmp/newgrip-web.log 2>&1 &
      - name: Run artifact and visual audits
        run: |
          python scripts/run_backend_artifact_validation.py
          node scripts/run_visual_audit.mjs
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: .artifacts/verification/
